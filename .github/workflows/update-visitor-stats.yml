name: Update Visitor Stats

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch Plausible stats
        env:
          PLAUSIBLE_API_TOKEN: ${{ secrets.PLAUSIBLE_API_TOKEN }}
        run: |
          if [ -z "$PLAUSIBLE_API_TOKEN" ]; then
            echo "PLAUSIBLE_API_TOKEN not configured; leaving visitor stats unchanged."
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $PLAUSIBLE_API_TOKEN" \
            "https://plausible.io/api/v1/stats/aggregate?site_id=stork343.github.io&period=30d&metrics=visitors,pageviews" \
            -o /tmp/plausible-stats.json
          node -e '
            const fs = require("fs");
            const raw = JSON.parse(fs.readFileSync("/tmp/plausible-stats.json", "utf8"));
            const results = raw.results || {};
            const toNumber = (value) => {
              const n = Number(value && value.value);
              return Number.isFinite(n) ? n : null;
            };
            const now = new Date();
            const pad = (n) => String(n).padStart(2, "0");
            const payload = {
              updated: now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()),
              period: "30d",
              pageviews: toNumber(results.pageviews),
              visitors: toNumber(results.visitors)
            };
            fs.writeFileSync("data/visitor-stats.generated.json", JSON.stringify(payload, null, 2) + "\n");
          '

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/visitor-stats.generated.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update visitor stats"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          else
            echo "No stats change."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
