name: Build Bookdown Notes

on:
  push:
    branches:
      - main
    paths:
      - "notes/**"
  workflow_dispatch:

permissions:
  contents: write

# Serialize writers to main with auto-sync-generated.yml to avoid
# concurrent-push races.
concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install bookdown
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: bookdown

      - name: Render book
        working-directory: notes
        run: Rscript -e "bookdown::render_book('index.Rmd')"

      - name: Commit and push rendered book
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/_book
          if ! git diff --cached --quiet; then
            git commit -m "chore: render bookdown notes"
            REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git pull --rebase "$REMOTE" main || true
            git push "$REMOTE" HEAD:main
          else
            echo "No rendered changes."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
