name: Site Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# 体检 B-3 / D-8：本 workflow 此前是唯一未声明 permissions 的，6 个只读 job 全部
# 持有仓库默认（可能可写）的 GITHUB_TOKEN，其中 link-check 还把这个 token 交给
# 第三方 action。现收敛为只读，并把所有 action 固定到 commit SHA（注释保留 tag），
# 同时给每个 job 加 timeout-minutes —— 此前任一 job 挂住都会白烧 6 小时 runner。
permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # 体检 D-8：此前只硬编码检查 main.js 与 paper-reader.js 两个文件。
      # 改为调用自我维护的检查器 scripts/check-syntax.js —— 它扫描 scripts/、
      # papers/shared/、tests/ui/ 与 playwright.config.js（当前 16 个文件），
      # 新增脚本自动纳入，不会再出现「加了脚本但忘了加进门禁」的漂移。
      - name: Check JavaScript syntax (all project scripts)
        run: npm --silent run check:syntax

      # htmlhint 此前用 `npx --yes htmlhint`，等于每次运行都从 registry 拉最新版执行，
      # 是一个未固定的供应链入口；现固定到 1.9.2。
      - name: Check HTML syntax (home page)
        run: npx --yes htmlhint@1.9.2 index.html

      - name: Check HTML syntax (paper pages)
        run: find papers -name '*.html' -print0 | xargs -0 npx --yes htmlhint@1.9.2

      - name: Validate publications data JSON
        run: python3 -m json.tool data/publications.json > /dev/null

      - name: Validate paper page config JSON
        run: python3 -m json.tool data/paper-pages.json > /dev/null

      - name: Validate generated TOC cache JSON
        run: python3 -m json.tool data/paper-toc.generated.json > /dev/null

      - name: Validate generated publications JSON-LD
        run: python3 -m json.tool data/publications-jsonld.generated.json > /dev/null

      - name: Validate generated paper SEO JSON
        run: python3 -m json.tool data/paper-seo.generated.json > /dev/null

      - name: Ensure generated site data is up to date
        run: node scripts/build-site-data.js --check

      - name: Ensure generated TOC cache is up to date
        run: node scripts/generate-paper-toc.js --check

      - name: Ensure paper SEO blocks are up to date
        run: node scripts/sync-paper-seo.js --check

      - name: Validate site data consistency
        run: node scripts/validate-site.js

      - name: Run WCAG contrast checks
        run: npm --silent run check:contrast

      - name: Run acceptance smoke checks
        run: node scripts/acceptance-check.js

  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --verbose
            --accept 200,429
            --exclude-loopback
            --max-redirects 5
            --timeout 20
            --max-concurrency 6
            --exclude "https://scholar.google.com/.*"
            --exclude "https://www.researchgate.net/.*"
            --exclude "https://kns.cnki.net/.*"
            --exclude "https://link.cnki.net/.*"
            --exclude "https://cdn.jsdelivr.net/.*"
            --exclude "https://www.sciencedirect.com/.*"
            index.html papers
        # 顶层 permissions 已把该 token 收敛为 contents:read，第三方 action 拿不到写权限
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright regression tests
        # 体检 D-8 / 路线图 13：此前跑 `npm run test:ui`（全部三个 spec），于是
        # accessibility.spec.js 在本 job 与 a11y-check job 各跑一遍，而 visual.spec.js
        # 开头有 test.skip(process.platform !== "darwin")，在 ubuntu 上三个用例全数跳过、
        # 白占一次浏览器启动。现按 job 名只跑 regression.spec.js，与 a11y-check
        # （accessibility.spec.js）、visual-regression（visual.spec.js，macos）
        # 形成 1:1 无重叠的三分。
        # 路线图原文给的是「改用 test:ui:core 或删 a11y-check job」；test:ui:core 仍会
        # 把 accessibility.spec.js 跑两遍，故取更彻底的按文件切分，达成同一条目要求的
        # 「消除重复执行」而不牺牲任一 job 的独立信号。
        run: npx playwright test tests/ui/regression.spec.js

  a11y-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npm run test:a11y

  visual-regression:
    runs-on: macos-latest
    # macOS runner 冷启动 + 三个基线截图，比 Linux job 慢得多
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run visual baseline tests
        run: npm run test:visual

      - name: Upload visual regression diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-diagnostics
          path: test-results/
          if-no-files-found: error
          retention-days: 3

  lighthouse-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run Lighthouse score gate
        run: npm run lighthouse
