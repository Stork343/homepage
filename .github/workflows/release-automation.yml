name: Release Automation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2026.03.01)"
        required: true
        type: string
      message:
        description: "Optional release note message"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run one-click release script
        env:
          # 体检 D-8：此前把 ${{ github.event.inputs.tag }} 直接内插进 run 的 shell
          # 命令行，是 GitHub Actions 的脚本注入反模式 —— 形如 `v1"; rm -rf . #`
          # 的输入会被当作 shell 代码执行。而且 release.sh:15 会把 TAG 拼进路径
          # release-artifacts/${TAG}，未校验的形状还能造成目录穿越。
          # 现改为经 env 传入、加引号使用，并先校验 tag 形状。
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          RELEASE_MESSAGE: ${{ github.event.inputs.message }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9A-Za-z.]+)?$'; then
            echo "::error::非法 tag 形状：${RELEASE_TAG}（期望 vYYYY.MM.DD，与现有 v2026.02.24 一致）"
            exit 1
          fi
          MESSAGE="${RELEASE_MESSAGE:-Release ${RELEASE_TAG}}"
          ./scripts/release.sh "$RELEASE_TAG" "$MESSAGE"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts-${{ github.event.inputs.tag }}
          path: release-artifacts/${{ github.event.inputs.tag }}
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          body_path: release-artifacts/${{ github.event.inputs.tag }}/CHANGELOG.generated.md
          files: |
            release-artifacts/${{ github.event.inputs.tag }}/rollback-point.json
            release-artifacts/${{ github.event.inputs.tag }}/rollback-main.bundle
