name: Deploy site to Pages

# ── 体检 B-2 ────────────────────────────────────────────────────────────────
# Pages 此前设为「Deploy from a branch」，等于把整个工作树发布到公开域名：
#   · data/site-master.json —— 构建输入（SSOT），且含 hidden 未公开条目 qapsm-icu-bp
#   · data/{search-index,paper-seo,metadata-cache}.generated.json —— 浏览器从不 fetch 的死产物
#   · notes/*.Rmd 与 notes/book.bib —— 笔记源稿与文献库
#   · beamer_presentation.tex、tests/、.github/、scripts/ 构建工具、docs/、scripts/ops/
# 本 workflow 改用「GitHub Actions」部署源，只发布白名单内的运行时产物，
# 并在上传前做越界自检：任何不该发布的路径混入 _site 都会让构建失败。
#
# 【需要作者手动完成的一步】仓库 Settings → Pages → Build and deployment →
#   Source 改为 "GitHub Actions"。在切换之前，本 workflow 会正常构建并上传产物，
#   但 Pages 仍从分支发布，因此可以先安全合入、核对 _site 清单，再切换开关。
#
# 白名单依据（实测，非推断）：
#   运行时被 <script src> 引用的只有 scripts/main.js；
#   运行时被 fetch 的数据只有 data/{publications,paper-pages,paper-toc.generated,
#   publications-jsonld.generated,site-updated.generated}.json；
#   站点检索是在内存里基于 publications.json 做的；search-index.generated.json 曾是
#   一个零运行时消费者的死产物，已在体检 D-6 中连生成器一起删除。下面 FORBIDDEN 清单
#   里仍保留它，作为「不许复活」的绊线。

on:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：只读仓库内容 + 写 Pages + 取 OIDC token（deploy-pages 必需）
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 部署中不允许取消，避免把站点留在半发布状态
  cancel-in-progress: false

jobs:
  validate:
    name: Validate before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 这三个脚本只依赖 node 内置模块（fs/path/crypto），无需 npm ci
      - name: Generated data in sync with SSOT
        run: node scripts/build-site-data.js --check

      - name: Site invariants
        run: node scripts/validate-site.js

      - name: WCAG AA contrast (resolved from real CSS)
        run: node scripts/check-contrast.js

  build:
    name: Build whitelisted artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Collect site artifacts (whitelist only)
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/data _site/scripts _site/notes

          # ── 站点根产物 ──
          cp index.html enhanced-main.css robots.txt sitemap.xml hj.jpg hj.webp _site/
          cp .nojekyll _site/

          # ── 运行时唯一被引用的脚本 ──
          cp scripts/main.js _site/scripts/

          # ── 运行时被 fetch 的数据；其余 *.json 是构建输入或死产物 ──
          cp data/publications.json \
             data/paper-pages.json \
             data/paper-toc.generated.json \
             data/publications-jsonld.generated.json \
             data/site-updated.generated.json \
             _site/data/

          # ── 图标、论文封面与阅读页 ──
          cp -R icon _site/icon
          cp -R papers _site/papers
          rm -f _site/papers/README.md

          # ── 笔记子站：只发布渲染产物，不发布 .Rmd 源稿与 book.bib ──
          cp -R notes/_book _site/notes/_book

          # ── hidden（未公开）条目：其封面目录与任何文本提及都不得发布 ──
          HIDDEN_IDS="$(python3 -c 'import json;m=json.load(open("data/site-master.json"));print(" ".join(str(p["id"]) for p in m.get("publications",[]) if p.get("hidden") and p.get("id")))')"
          if [ -n "$HIDDEN_IDS" ]; then
            for id in $HIDDEN_IDS; do
              find _site/papers -mindepth 2 -maxdepth 2 -type d -name "$id" -print -exec rm -rf {} + || true
              if grep -rq -- "$id" _site/data _site/index.html 2>/dev/null; then
                echo "::error::已发布内容中出现 hidden 条目：$id"
                exit 1
              fi
            done
            echo "已排除 hidden 条目：$HIDDEN_IDS"
          fi

          # ── 越界自检：白名单外的路径一旦混入即判失败 ──
          for forbidden in \
            data/site-master.json \
            data/search-index.generated.json \
            data/paper-seo.generated.json \
            data/metadata-cache.generated.json \
            notes/book.bib \
            notes/_bookdown.yml \
            notes/_output.yml \
            notes/style.css \
            beamer_presentation.tex \
            README.md \
            CHANGELOG.md \
            package.json \
            package-lock.json \
            playwright.config.js
          do
            if [ -e "_site/$forbidden" ]; then
              echo "::error::白名单越界：_site/$forbidden 不应被发布"
              exit 1
            fi
          done
          for forbidden_dir in tests .github docs scripts/ops .vscode; do
            if [ -e "_site/$forbidden_dir" ]; then
              echo "::error::白名单越界：_site/$forbidden_dir 不应被发布"
              exit 1
            fi
          done
          if [ -n "$(find _site/scripts -type f ! -name main.js -print -quit)" ]; then
            echo "::error::_site/scripts 只应包含 main.js"
            exit 1
          fi
          if [ -n "$(find _site -name '*.Rmd' -print -quit)" ]; then
            echo "::error::_site 中出现 .Rmd 源稿"
            exit 1
          fi
          if [ -n "$(find _site -name '*.pdf' ! -path '*/papers/2025/svcqr/*' ! -path '*/papers/2025/hcqr/*' ! -path '*/cv/*' -print -quit)" ]; then
            echo "::error::_site 中出现白名单外的 PDF（出版社排版全文不得再分发）"
            exit 1
          fi

          echo "── 发布清单 ──"
          echo "文件数：$(find _site -type f | wc -l)"
          du -sh _site
          find _site -maxdepth 2 -type d | sort | sed 's/^/  /'

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
