name: Auto Sync Generated Data

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Serialize writers to main with build-bookdown-notes.yml to avoid
# concurrent-push races.
concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate site data and SEO blocks
        run: |
          node scripts/build-site-data.js --write
          node scripts/sync-paper-seo.js --write
          node scripts/generate-paper-toc.js --write

      - name: Commit and push generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync generated site data"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          else
            echo "No generated changes."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
